name: SDCC MCS-51 family build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcs51-family-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler-build:
    name: SDCC compiler, assemblers and runtime libraries
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out SDCC
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            bison \
            build-essential \
            flex \
            libboost-dev \
            libreadline-dev \
            texinfo \
            zlib1g-dev

      - name: Configure SDCC
        run: |
          mkdir sdcc-build
          cd sdcc-build
          CFLAGS=-std=gnu17 ../configure \
            --enable-mcs251-port \
            --disable-z80-port \
            --disable-z180-port \
            --disable-r2k-port \
            --disable-r2ka-port \
            --disable-r3ka-port \
            --disable-r4k-port \
            --disable-r5k-port \
            --disable-r6k-port \
            --disable-sm83-port \
            --disable-tlcs90-port \
            --disable-ez80-port \
            --disable-z80n-port \
            --disable-r800-port \
            --disable-ds390-port \
            --disable-ds400-port \
            --disable-pic14-port \
            --disable-pic16-port \
            --disable-hc08-port \
            --disable-s08-port \
            --disable-stm8-port \
            --disable-pdk13-port \
            --disable-pdk14-port \
            --disable-pdk15-port \
            --disable-mos6502-port \
            --disable-mos65c02-port \
            --disable-f8-port \
            --disable-f8l-port \
            --disable-non-free \
            --disable-ucsim \
            --disable-sdcdb

      - name: Build SDCC
        run: make -C sdcc-build -j"$(nproc)"

      - name: Verify built tool and library inventory
        run: |
          sdcc-build/bin/sdcc --version | grep -F 'mcs51/mcs251'
          for tool in sdcc sdas8051 sdas251 sdld sdldmcs251; do
            test -x "sdcc-build/bin/$tool"
          done
          for model in mcs251-small mcs251-small-stack-auto mcs251-large mcs251-large-stack-auto; do
            test -s "sdcc-build/device/lib/build/$model/mcs251.lib"
          done

      - name: Upload build failure logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: mcs51-family-build-logs
          path: |
            sdcc-build/config.log
            sdcc-build/support/cpp/config.log
            sdcc-build/support/sdbinutils/config.log
          if-no-files-found: ignore
          retention-days: 14
